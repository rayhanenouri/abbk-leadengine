[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abbk-backend"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
  # API
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "python-multipart>=0.0.9",

  # Database
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "psycopg2-binary>=2.9.9",  # for sync operations (Alembic)

  # Auth
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "pydantic[email]>=2.7.0",
  "pydantic-settings>=2.2.0",

  # Task queue
  "celery[redis]>=5.3.6",
  "redis>=5.0.3",
  "flower>=2.0.1",

  # Scraping
  "playwright>=1.44.0",
  "scrapy>=2.11.0",
  "beautifulsoup4>=4.12.3",
  "httpx>=0.27.0",
  "lxml>=5.2.0",
  "apify-client>=1.7.0",

  # AI
  "anthropic>=0.28.0",

  # Data processing
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "openpyxl>=3.1.0",  # Excel export

  # Utilities
  "python-dotenv>=1.0.1",
  "loguru>=0.7.2",
  "tenacity>=8.3.0",  # retry logic for scraping
]
